<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>중국어 표현집</title>
  <meta name="theme-color" content="#1b1f2a">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --primary: #49bf9d;
      --accent: #6fc3df;
      --warn: #e8a87c;
      --bg: #1b1f2a;
      --bg2: #242837;
      --bg3: #2e3141;
      --text: #c8ccd8;
      --text-strong: #ffffff;
      --muted: #8a90a2;
      --border: rgba(255,255,255,0.08);
    }
    html { scroll-behavior: smooth; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Source Sans 3', 'Noto Sans KR', system-ui, sans-serif;
      line-height: 1.6;
      font-size: 16px;
    }
    a { color: var(--primary); }
    .wrap { max-width: 960px; margin: 0 auto; padding: 0 16px; }

    header.hero {
      padding: 48px 0 24px;
      text-align: center;
    }
    header.hero h1 { color: var(--text-strong); font-size: 2rem; letter-spacing: -0.01em; }
    header.hero p { color: var(--muted); margin-top: 6px; }

    nav.tabs {
      position: sticky; top: 0; z-index: 10;
      background: rgba(27,31,42,0.95);
      backdrop-filter: blur(6px);
      border-bottom: 1px solid var(--border);
    }
    nav.tabs .wrap { display: flex; gap: 4px; overflow-x: auto; padding-top: 8px; padding-bottom: 8px; }
    nav.tabs button {
      flex: 0 0 auto;
      background: transparent; color: var(--text);
      border: 1px solid var(--border); border-radius: 999px;
      padding: 8px 16px; font: inherit; font-weight: 600; cursor: pointer;
    }
    nav.tabs button.active { background: var(--primary); color: #fff; border-color: var(--primary); }

    .toolbar {
      display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
      margin: 20px 0 8px;
    }
    .toolbar input[type=search] {
      flex: 1 1 220px; min-width: 0;
      background: var(--bg2); color: var(--text-strong);
      border: 1px solid var(--border); border-radius: 8px;
      padding: 10px 12px; font: inherit;
    }
    .toggle {
      display: inline-flex; align-items: center; gap: 6px;
      background: var(--bg2); border: 1px solid var(--border); border-radius: 8px;
      padding: 9px 12px; cursor: pointer; user-select: none; font-size: 0.95rem;
    }
    .hint { color: var(--muted); font-size: 0.9rem; margin-bottom: 12px; }

    section.panel { display: none; padding-bottom: 64px; }
    section.panel.active { display: block; }

    .group { margin-top: 28px; }
    .group h2 {
      color: var(--text-strong); font-size: 1.2rem;
      display: flex; align-items: baseline; gap: 8px;
      border-bottom: 1px solid var(--border); padding-bottom: 6px; margin-bottom: 12px;
    }
    .group h2 small { color: var(--muted); font-weight: 400; font-size: 0.9rem; }

    .card {
      background: var(--bg2); border: 1px solid var(--border); border-radius: 10px;
      padding: 12px 14px; margin-bottom: 8px;
      display: flex; gap: 12px; align-items: flex-start;
    }
    .card .body { flex: 1; min-width: 0; }
    .en { color: var(--text-strong); font-size: 1.05rem; font-weight: 600; }
    .py { color: var(--primary); font-size: 0.92rem; margin-top: 1px; }
    .ko { color: var(--muted); font-size: 0.95rem; margin-top: 2px; }
    .note { color: var(--accent); font-size: 0.85rem; margin-top: 4px; }
    .actions { display: flex; gap: 4px; flex: 0 0 auto; }
    .iconbtn {
      background: var(--bg3); color: var(--text); border: 1px solid var(--border);
      border-radius: 6px; width: 34px; height: 34px; cursor: pointer;
      display: inline-flex; align-items: center; justify-content: center; font-size: 0.95rem;
    }
    .iconbtn:hover { color: var(--primary); border-color: var(--primary); }
    .iconbtn.on { color: #f5c542; border-color: #f5c542; }

    /* soften pairs */
    .pair { display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; align-items: center; }
    .pair .from { color: var(--warn); text-decoration: line-through; text-decoration-color: rgba(232,168,124,0.5); }
    .pair .arrow { color: var(--muted); }
    @media (max-width: 600px) {
      .pair { grid-template-columns: 1fr; gap: 2px; }
      .pair .arrow { display: none; }
      .card { flex-direction: column; }
      .actions { align-self: flex-end; }
    }

    /* practice mode: hide English until tapped */
    body.practice .py { filter: blur(6px); }
    body.practice .card:has(.en.revealed) .py { filter: none; }
    body.practice .en { filter: blur(6px); cursor: pointer; transition: filter .15s; }
    body.practice .en.revealed { filter: none; }

    /* forms */
    form.add {
      display: grid; grid-template-columns: 1fr 1fr 1fr 1fr auto; gap: 8px;
      background: var(--bg2); border: 1px dashed var(--border); border-radius: 10px; padding: 12px;
      margin-top: 12px;
    }
    form.add input {
      min-width: 0; background: var(--bg); color: var(--text-strong);
      border: 1px solid var(--border); border-radius: 6px; padding: 8px 10px; font: inherit;
    }
    form.add button, .btn {
      background: var(--primary); color: #fff; border: 0; border-radius: 6px;
      padding: 8px 14px; font: inherit; font-weight: 600; cursor: pointer;
    }
    .btn.ghost { background: var(--bg3); color: var(--text); border: 1px solid var(--border); }
    @media (max-width: 600px) { form.add { grid-template-columns: 1fr; } }

    textarea.script {
      width: 100%; min-height: 280px; resize: vertical;
      background: var(--bg2); color: var(--text-strong);
      border: 1px solid var(--border); border-radius: 10px; padding: 14px; font: inherit; line-height: 1.7;
    }
    .row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; align-items: center; }
    .empty { color: var(--muted); padding: 16px; text-align: center; border: 1px dashed var(--border); border-radius: 10px; }
    .toast {
      position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
      background: var(--primary); color: #fff; padding: 8px 16px; border-radius: 999px;
      opacity: 0; transition: opacity .2s; pointer-events: none; font-weight: 600;
      max-width: calc(100vw - 32px); width: max-content; text-align: center; border-radius: 16px; z-index: 1000;
    }
    .toast.show { opacity: 1; }
    footer { color: var(--muted); text-align: center; font-size: 0.85rem; padding: 24px 0 40px; }
  </style>
</head>
<body>
  <header class="hero">
    <div class="wrap">
      <h1>중국어 표현집</h1>
      <p>기초 표현부터 쉬운 발표 문장, 업무 단어까지 병음과 함께 외우기</p>
    </div>
  </header>

  <nav class="tabs">
    <div class="wrap" role="tablist">
      <button data-tab="phrases" class="active">기초·발표 문장</button>
      <button data-tab="soften">공손하게 말하기</button>
      <button data-tab="vocab">업무 단어</button>
      <button data-tab="starred">★ 즐겨찾기</button>
      <button data-tab="script">작문 연습</button>
    </div>
  </nav>

  <main class="wrap">
    <div class="toolbar">
      <input type="search" id="q" placeholder="중국어, 병음, 한국어로 검색 (예: nihao, 감사)" />
      <label class="toggle"><input type="checkbox" id="practice" /> 연습 모드</label>
    </div>
    <p class="hint">🔊 발음 듣기 · 📋 복사 · ☆ 즐겨찾기. 연습 모드에서는 중국어가 가려지고, 한국어를 보고 말해본 뒤 눌러서 확인할 수 있어요.</p>

    <section class="panel active" id="panel-phrases"></section>
    <section class="panel" id="panel-soften"></section>
    <section class="panel" id="panel-vocab"></section>
    <section class="panel" id="panel-starred"></section>
    <section class="panel" id="panel-script">
      <div class="group">
        <h2>작문 연습 <small>이 브라우저에 자동 저장돼요</small></h2>
        <textarea class="script" id="scriptText" placeholder="大家好！我叫…"></textarea>
        <div class="row">
          <button class="btn" id="readScript">🔊 원고 읽어주기</button>
          <button class="btn ghost" id="stopScript">■ 멈추기</button>
          <label class="toggle">속도
            <select id="rate" style="background:transparent;color:inherit;border:0;font:inherit">
              <option value="0.8">느리게</option>
              <option value="0.95" selected>보통</option>
              <option value="1.1">빠르게</option>
            </select>
          </label>
          <span class="hint" id="wordCount" style="margin:0"></span>
        </div>
      </div>
    </section>
  </main>

  <footer>Chinese_Edu · 내가 추가한 단어, 즐겨찾기, 원고는 이 기기의 브라우저에만 저장됩니다.</footer>
  <div class="toast" id="toast">복사했어요</div>

<script>
/* ───────────── 데이터 ───────────── */
// 배우는 단계용: 기초 표현 → 자기소개 → 쉬운 발표 문장. py = 병음
const PHRASES = [
  { title: '인사·기본 표현', sub: '基本用语', items: [
    { en: "你好！", py: "Nǐ hǎo!", ko: "안녕하세요!" },
    { en: "大家好！", py: "Dàjiā hǎo!", ko: "여러분 안녕하세요!", note: "발표 시작할 때 첫마디" },
    { en: "谢谢。", py: "Xièxie.", ko: "감사합니다." },
    { en: "不客气。", py: "Bú kèqi.", ko: "천만에요." },
    { en: "对不起。", py: "Duìbuqǐ.", ko: "죄송합니다." },
    { en: "没关系。", py: "Méi guānxi.", ko: "괜찮아요." },
    { en: "请问……", py: "Qǐngwèn……", ko: "실례지만, 여쭤볼게요…", note: "질문을 시작할 때" },
    { en: "初次见面，请多关照。", py: "Chūcì jiànmiàn, qǐng duō guānzhào.", ko: "처음 뵙겠습니다, 잘 부탁드립니다." },
    { en: "很高兴认识您。", py: "Hěn gāoxìng rènshi nín.", ko: "만나서 반갑습니다.", note: "您(nín)은 你(nǐ)의 높임말" },
    { en: "再见！", py: "Zàijiàn!", ko: "안녕히 계세요 / 또 봬요!" },
  ]},
  { title: '자기소개·회사소개', sub: '自我介绍', items: [
    { en: "我叫___。", py: "Wǒ jiào ___.", ko: "제 이름은 ___입니다." },
    { en: "我是韩国人。", py: "Wǒ shì Hánguó rén.", ko: "저는 한국 사람입니다." },
    { en: "我在菲尼克斯电气工作。", py: "Wǒ zài Fēiníkèsī Diànqì gōngzuò.", ko: "저는 피닉스컨택트에서 일합니다.", note: "菲尼克斯电气 = Phoenix Contact의 중국어 이름" },
    { en: "我在自动化事业部工作。", py: "Wǒ zài zìdònghuà shìyèbù gōngzuò.", ko: "저는 오토메이션 사업부에서 일합니다." },
    { en: "我负责PLC和工业网络产品。", py: "Wǒ fùzé PLC hé gōngyè wǎngluò chǎnpǐn.", ko: "저는 PLC와 산업용 네트워크 제품을 담당합니다." },
    { en: "我的中文不太好，请多包涵。", py: "Wǒ de Zhōngwén bú tài hǎo, qǐng duō bāohan.", ko: "중국어가 서툴러요, 너그럽게 봐주세요.", note: "발표 전에 한마디 하면 분위기가 부드러워져요" },
    { en: "我正在学习中文。", py: "Wǒ zhèngzài xuéxí Zhōngwén.", ko: "저는 중국어를 배우는 중입니다." },
  ]},
  { title: '발표 전 아이스브레이킹', sub: '开场破冰 · 격식 있는 인사와 감사로 시작', items: [
    { en: "尊敬的各位领导、各位来宾，大家上午好！", py: "Zūnjìng de gèwèi lǐngdǎo, gèwèi láibīn, dàjiā shàngwǔ hǎo!", ko: "존경하는 각 대표님들, 내빈 여러분, 좋은 아침입니다!", note: "공식 발표의 정석 첫마디. 오후면 下午好(xiàwǔ hǎo)" },
    { en: "各位朋友，大家好！", py: "Gèwèi péngyou, dàjiā hǎo!", ko: "여러분, 안녕하세요!", note: "조금 덜 격식 있는 자리" },
    { en: "非常感谢大家在百忙之中抽出时间来参加。", py: "Fēicháng gǎnxiè dàjiā zài bǎimáng zhīzhōng chōuchū shíjiān lái cānjiā.", ko: "바쁘신 와중에 시간 내어 참석해 주셔서 정말 감사합니다.", note: "중국 발표에서 거의 빠지지 않는 감사 인사" },
    { en: "感谢贵公司的热情接待。", py: "Gǎnxiè guì gōngsī de rèqíng jiēdài.", ko: "귀사의 따뜻한 환대에 감사드립니다.", note: "고객사를 방문했을 때. 贵公司 = 귀사" },
    { en: "很荣幸今天有机会在这里和大家交流。", py: "Hěn róngxìng jīntiān yǒu jīhuì zài zhèlǐ hé dàjiā jiāoliú.", ko: "오늘 이 자리에서 여러분과 이야기 나눌 기회를 갖게 되어 영광입니다." },
    { en: "我们和贵公司已经合作很多年了，今天能再来非常高兴。", py: "Wǒmen hé guì gōngsī yǐjīng hézuò hěn duō nián le, jīntiān néng zài lái fēicháng gāoxìng.", ko: "귀사와 오랫동안 함께해 왔는데, 오늘 다시 오게 되어 매우 기쁩니다.", note: "관계(关系)를 중시하는 문화라 효과가 좋아요" },
    { en: "这是我第一次来___，这里真的很漂亮。", py: "Zhè shì wǒ dì yī cì lái ___, zhèlǐ zhēn de hěn piàoliang.", ko: "___에 처음 와봤는데, 정말 아름답네요.", note: "도시를 칭찬하면 분위기가 부드러워져요" },
    { en: "我的中文还不太好，请大家多多包涵。", py: "Wǒ de Zhōngwén hái bú tài hǎo, qǐng dàjiā duōduō bāohán.", ko: "제 중국어가 아직 서툴러서, 너그럽게 봐주시길 부탁드립니다.", note: "외국인이 중국어로 이렇게 말하면 대부분 박수로 받아줘요" },
    { en: "后排的朋友能听清楚吗？", py: "Hòupái de péngyou néng tīng qīngchu ma?", ko: "뒷줄에 계신 분들 잘 들리세요?" },
    { en: "大家能看清屏幕吗？", py: "Dàjiā néng kàn qīng píngmù ma?", ko: "화면 잘 보이세요?" },
    { en: "我们再等一两分钟，等大家到齐。", py: "Wǒmen zài děng yì liǎng fēnzhōng, děng dàjiā dào qí.", ko: "다들 오실 때까지 1~2분만 더 기다리겠습니다." },
    { en: "刚吃完午饭，大家可能有点困，我尽量讲得轻松一点。", py: "Gāng chī wán wǔfàn, dàjiā kěnéng yǒudiǎn kùn, wǒ jǐnliàng jiǎng de qīngsōng yìdiǎn.", ko: "점심 직후라 조금 졸리실 텐데, 최대한 편하게 진행해 보겠습니다.", note: "가벼운 웃음 유도" },
    { en: "那我们就开始吧！", py: "Nà wǒmen jiù kāishǐ ba!", ko: "그럼 시작하겠습니다!" },
  ]},
  { title: '발표 시작·진행', sub: '开始和进行', items: [
    { en: "今天我想介绍一下___。", py: "Jīntiān wǒ xiǎng jièshào yíxià ___.", ko: "오늘은 ___을 소개하려고 합니다." },
    { en: "我的报告分为三个部分。", py: "Wǒ de bàogào fēn wéi sān ge bùfen.", ko: "제 발표는 세 부분으로 나뉩니다." },
    { en: "首先……，然后……，最后……", py: "Shǒuxiān……, ránhòu……, zuìhòu……", ko: "먼저…, 그다음에…, 마지막으로…" },
    { en: "请看这张图。", py: "Qǐng kàn zhè zhāng tú.", ko: "이 그림(그래프)을 봐주세요." },
    { en: "下面我们来看___。", py: "Xiàmiàn wǒmen lái kàn ___.", ko: "다음으로 ___을 보겠습니다." },
    { en: "这个很重要。", py: "Zhège hěn zhòngyào.", ko: "이건 아주 중요합니다." },
    { en: "比如说，___。", py: "Bǐrú shuō, ___.", ko: "예를 들면, ___." },
    { en: "这个产品的优点是___。", py: "Zhège chǎnpǐn de yōudiǎn shì ___.", ko: "이 제품의 장점은 ___입니다." },
  ]},
  { title: '질문·마무리', sub: '提问和结束', items: [
    { en: "大家有什么问题吗？", py: "Dàjiā yǒu shénme wèntí ma?", ko: "질문 있으신가요?" },
    { en: "请再说一遍。", py: "Qǐng zài shuō yí biàn.", ko: "한 번 더 말씀해 주세요." },
    { en: "请说慢一点。", py: "Qǐng shuō màn yìdiǎn.", ko: "조금 천천히 말씀해 주세요." },
    { en: "我不太明白。", py: "Wǒ bú tài míngbai.", ko: "잘 이해하지 못했어요." },
    { en: "我稍后用邮件回复您。", py: "Wǒ shāohòu yòng yóujiàn huífù nín.", ko: "나중에 메일로 답변드리겠습니다." },
    { en: "总结一下，___。", py: "Zǒngjié yíxià, ___.", ko: "정리하자면, ___." },
    { en: "谢谢大家！", py: "Xièxie dàjiā!", ko: "여러분 감사합니다!" },
  ]},
  { title: '숫자·단위', sub: '数字', items: [
    { en: "一、二、三、四、五", py: "yī, èr, sān, sì, wǔ", ko: "1, 2, 3, 4, 5" },
    { en: "六、七、八、九、十", py: "liù, qī, bā, jiǔ, shí", ko: "6, 7, 8, 9, 10" },
    { en: "百 / 千 / 万", py: "bǎi / qiān / wàn", ko: "백 / 천 / 만" },
    { en: "百分之二十", py: "bǎi fēn zhī èrshí", ko: "20퍼센트", note: "백분의 이십 → 20%" },
    { en: "增加了百分之十。", py: "Zēngjiā le bǎi fēn zhī shí.", ko: "10% 증가했습니다." },
  ]},
];

const SOFTEN = [
  { title: '공손하게 부탁하기', sub: '礼貌请求', items: [

/* ───────────── 저장소 (이 브라우저에만) ───────────── */
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
let myWords = store.get('zh.myWords', []);
let stars = new Set(store.get('zh.stars', []));

/* ───────────── 렌더링 ───────────── */
const norm = s => String(s).normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const keyOf = it => it.en;

function cardHTML(it, opts = {}) {
  const starred = stars.has(keyOf(it));
  const main = it.from
    ? `<div class="pair"><div class="from">${esc(it.from)}</div><div class="arrow">→</div><div class="en">${esc(it.en)}</div></div>`
    : `<div class="en">${esc(it.en)}</div>`;
  return `<div class="card" data-search="${esc(norm(it.en + ' ' + (it.py||'') + ' ' + it.ko + ' ' + (it.from||'') + ' ' + (it.note||'')))}">
    <div class="body">${main}
      ${it.py ? `<div class="py">${esc(it.py)}</div>` : ''}
      <div class="ko">${esc(it.ko)}</div>
      ${it.note ? `<div class="note">${esc(it.note)}</div>` : ''}
    </div>
    <div class="actions">
      <button class="iconbtn" data-act="say" data-text="${esc(it.en)}" title="발음 듣기">🔊</button>
      <button class="iconbtn" data-act="copy" data-text="${esc(it.en)}" title="복사">📋</button>
      <button class="iconbtn ${starred ? 'on' : ''}" data-act="star" data-key="${esc(keyOf(it))}" title="즐겨찾기">${starred ? '★' : '☆'}</button>
      ${opts.deletable ? `<button class="iconbtn" data-act="del" data-key="${esc(it.en)}" title="삭제">✕</button>` : ''}
    </div>
  </div>`;
}

function groupsHTML(groups, opts) {
  return groups.map(g => `<div class="group"><h2>${esc(g.title)} <small>${esc(g.sub || '')}</small></h2>
    ${g.items.length ? g.items.map(it => cardHTML(it, opts)).join('') : `<div class="empty">${esc(g.empty || '')}</div>`}
  </div>`).join('');
}

function render() {
  document.getElementById('panel-phrases').innerHTML = groupsHTML(PHRASES);
  document.getElementById('panel-soften').innerHTML = groupsHTML(SOFTEN);

  document.getElementById('panel-vocab').innerHTML = groupsHTML(VOCAB_BASE);

  const all = [...PHRASES, ...SOFTEN, ...VOCAB_BASE].flatMap(g => g.items);
  const starredItems = all.filter((it, i, arr) => stars.has(keyOf(it)) && arr.findIndex(x => keyOf(x) === keyOf(it)) === i);
  document.getElementById('panel-starred').innerHTML = groupsHTML([{ title: '즐겨찾기', sub: '발표 전에 빠르게 훑어보기', items: starredItems, empty: '☆를 눌러 자주 볼 문장을 모아두세요.' }]);

  applySearch();
}


/* ───────────── 검색 ───────────── */
function applySearch() {
  const q = norm(document.getElementById('q').value.trim()), qs = q.replace(/\s+/g, '');
  document.querySelectorAll('section.panel .group').forEach(g => {
    let shown = 0;
    g.querySelectorAll('.card').forEach(c => {
      const hit = !q || c.dataset.search.includes(q) || c.dataset.search.replace(/\s+/g, '').includes(qs);
      c.style.display = hit ? '' : 'none';
      if (hit) shown++;
    });
    const hasCards = g.querySelector('.card');
    g.style.display = (!q || !hasCards || shown) ? '' : 'none';
  });
}
document.getElementById('q').addEventListener('input', applySearch);

/* ───────────── 탭 ───────────── */
function showTab(name) {
  document.querySelectorAll('nav.tabs button').forEach(b => b.classList.toggle('active', b.dataset.tab === name));
  document.querySelectorAll('section.panel').forEach(p => p.classList.toggle('active', p.id === 'panel-' + name));
  store.set('zh.tab', name);
}
document.querySelectorAll('nav.tabs button').forEach(b => b.addEventListener('click', () => showTab(b.dataset.tab)));

// ---- 음성 읽기 (여러 브라우저/휴대폰에서 안정적으로 동작하도록) ----
const TTS_LANG = 'zh-CN', TTS_LANG_NAME = '중국어';
let ttsVoices = [], ttsCurrent = null, ttsWarnedNoVoice = false;
function ttsLoadVoices() {
  try { ttsVoices = speechSynthesis.getVoices() || []; } catch (e) { ttsVoices = []; }
}
if ('speechSynthesis' in window) {
  ttsLoadVoices();
  if (speechSynthesis.addEventListener) speechSynthesis.addEventListener('voiceschanged', ttsLoadVoices);
  else speechSynthesis.onvoiceschanged = ttsLoadVoices;
}
function ttsPickVoice() {
  if (!ttsVoices.length) ttsLoadVoices();
  const norm = l => (l || '').replace('_', '-').toLowerCase();
  const want = TTS_LANG.toLowerCase(), base = want.split('-')[0];
  const exact = ttsVoices.filter(v => norm(v.lang) === want);
  const same = exact.length ? exact : ttsVoices.filter(v => norm(v.lang).split('-')[0] === base);
  if (!same.length) return null;
  return same.find(v => v.localService) || same[0];
}
function ttsChunks(text) {
  // 긴 글은 문장 단위로 나눠 읽기 (Chrome은 15초 넘게 읽으면 멈추는 문제가 있음)
  const parts = text.match(/[^.!?。！？\n]+[.!?。！？]*\s*/g) || [text];
  const out = [];
  parts.forEach(p => {
    p = p.trim(); if (!p) return;
    while (p.length > 200) {
      let cut = p.lastIndexOf(' ', 200); if (cut < 50) cut = 200;
      out.push(p.slice(0, cut)); p = p.slice(cut).trim();
    }
    if (p) out.push(p);
  });
  return out.length ? out : [text];
}
function speak(text, rate = 0.95) {
  if (!('speechSynthesis' in window) || typeof SpeechSynthesisUtterance === 'undefined') {
    toast(/KAKAOTALK/i.test(navigator.userAgent)
      ? '카카오톡 안에서는 소리가 안 나요. 오른쪽 위 메뉴 → "다른 브라우저로 열기"를 눌러주세요'
      : '이 브라우저는 음성 읽기를 지원하지 않아요. Chrome이나 Safari로 열어주세요', 4000);
    return;
  }
  text = (text || '').replace(/_+/g, ' ').trim();
  if (!text) return;
  const synth = speechSynthesis;
  if (synth.speaking || synth.pending) synth.cancel();
  if (synth.paused) synth.resume();
  const voice = ttsPickVoice();
  if (!voice && ttsVoices.length && !ttsWarnedNoVoice) {
    ttsWarnedNoVoice = true;
    toast('이 기기에 ' + TTS_LANG_NAME + ' 음성이 없어요. 휴대폰 설정 → 음성 출력(TTS)에서 ' + TTS_LANG_NAME + ' 음성을 설치해 주세요', 5000);
  }
  let started = false;
  const chunks = ttsChunks(text);
  const queue = chunks.map(c => {
    const u = new SpeechSynthesisUtterance(c);
    u.lang = TTS_LANG; u.rate = rate; u.volume = 1;
    if (voice) u.voice = voice;
    u.onstart = () => { started = true; };
    u.onerror = e => {
      if (e.error === 'interrupted' || e.error === 'canceled') return;
      if (e.error === 'not-allowed') toast('한 번 더 눌러주세요 (브라우저가 소리를 막았어요)', 2500);
      else if (e.error === 'language-unavailable' || e.error === 'voice-unavailable') toast('이 기기에 ' + TTS_LANG_NAME + ' 음성이 없어요. 설정에서 음성을 설치해 주세요', 4000);
      else toast('소리를 재생하지 못했어요 (' + e.error + ')', 2500);
    };
    return u;
  });
  ttsCurrent = queue; // 참조를 잡아둬야 일부 브라우저에서 소리가 중간에 끊기지 않음
  queue.forEach(u => synth.speak(u));
  setTimeout(() => {
    if (!started && ttsCurrent === queue && !synth.speaking) {
      toast('소리가 안 나면: 무음 모드 해제·볼륨 확인, 또는 Chrome/Safari로 열어보세요', 4000);
    }
  }, 3000);
}
let toastTimer;
function toast(msg, ms = 1400) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), ms);
}

document.addEventListener('click', async e => {
  const en = e.target.closest('.en');
  if (en && document.body.classList.contains('practice')) { en.classList.toggle('revealed'); return; }
  const b = e.target.closest('[data-act]');
  if (!b) return;
  const act = b.dataset.act;
  if (act === 'say') speak(b.dataset.text);
  if (act === 'copy') {
    try { await navigator.clipboard.writeText(b.dataset.text); toast('복사했어요'); } catch { toast('복사하지 못했어요'); }
  }
  if (act === 'star') {
    const k = b.dataset.key;
    stars.has(k) ? stars.delete(k) : stars.add(k);
    store.set('zh.stars', [...stars]); render();
  }
  if (act === 'del') {
    myWords = myWords.filter(w => w.en !== b.dataset.key);
    store.set('zh.myWords', myWords); render();
  }
});

const practice = document.getElementById('practice');
practice.addEventListener('change', () => {
  document.body.classList.toggle('practice', practice.checked);
  document.querySelectorAll('.en.revealed').forEach(el => el.classList.remove('revealed'));
});

/* ───────────── 원고 ───────────── */
const scriptEl = document.getElementById('scriptText');
const wc = document.getElementById('wordCount');
function updateCount() {
  const words = scriptEl.value.replace(/[\s，。！？、,.!?]/g, '').length;
  // 발표 속도 약 200자/분 기준
  wc.textContent = words ? `${words}자 · 약 ${Math.max(1, Math.round(words / 200))}분` : '';
}
scriptEl.value = store.get('zh.script', '');
updateCount();
scriptEl.addEventListener('input', () => { store.set('zh.script', scriptEl.value); updateCount(); });
document.getElementById('readScript').onclick = () => scriptEl.value.trim() && speak(scriptEl.value, parseFloat(document.getElementById('rate').value));
document.getElementById('stopScript').onclick = () => 'speechSynthesis' in window && speechSynthesis.cancel();

render();
showTab(store.get('zh.tab', 'phrases'));
</script>
